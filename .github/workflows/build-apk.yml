name: Bangun APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Bangun APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee /tmp/build.log
      - name: Simpan APK ke cabang apk
        run: |
          VER=$(grep versionName app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          mkdir -p /tmp/out
          cp app/build/outputs/apk/release/app-release.apk "/tmp/out/VcV-$VER.apk"
          cd /tmp/out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "APK hasil build otomatis dari ${GITHUB_SHA}" > README.md
          git add . && git commit -q -m "APK VcV $VER (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
      - name: Simpan catatan error ke cabang build-log
        if: failure()
        run: |
          mkdir -p /tmp/log && cp /tmp/build.log /tmp/log/build.log || echo "tidak ada log" > /tmp/log/build.log
          cd /tmp/log
          git init -q -b build-log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -q -m "Log gagal ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" build-log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vcv-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
